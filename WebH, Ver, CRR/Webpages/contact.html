<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; }
        header, footer { background: #004d99; color: white; text-align: center; padding: 15px; }
        nav a { color: white; margin: 10px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        form { max-width: 420px; margin: 40px auto; text-align: left; }
        label { display: block; margin: 10px 0 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 12px; padding: 10px 20px; background: #004d99; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .note { text-align: center; margin-top: 20px; color: #555; }
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <form onsubmit="alert('This is a static demo. No form submission.'); return false;">
        <label for="name">Your Name</label>
        <input id="name" type="text" placeholder="Enter your name" required>
        <label for="email">Your Email</label>
        <input id="email" type="email" placeholder="Enter your email" required>
        <label for="message">Your Message</label>
        <textarea id="message" rows="5" placeholder="Enter your message"></textarea>
        <button type="submit">Send</button>
    </form>

    <p class="note">Note: This is a static site demo. The form does not send data.</p>

    <footer>
        <p>&copy; 2025 My S3 Website</p>
    </footer>
</body>
</html>
